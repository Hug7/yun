name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "clang-format==22.1.8" "ruff==0.15.20"

      - name: clang-format
        run: git ls-files -z '*.h' '*.cpp' | xargs -0 clang-format --dry-run --Werror

      - name: ruff check
        run: ruff check conanfile.py scripts/

      - name: ruff format
        run: ruff format --check conanfile.py scripts/

      - name: Python syntax
        run: python -m compileall -q conanfile.py scripts

      - name: actionlint
        run: |
          set -euo pipefail
          version=1.7.8
          asset="actionlint_${version}_linux_amd64.tar.gz"
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          curl -fsSL "${base}/${asset}" -o "/tmp/${asset}"
          curl -fsSL "${base}/actionlint_${version}_checksums.txt" -o /tmp/actionlint.sha256
          (cd /tmp && grep " ${asset}$" actionlint.sha256 | sha256sum -c -)
          tar -xzf "/tmp/${asset}" -C /tmp actionlint
          /tmp/actionlint -color .github/workflows/*.yml

  build-test:
    name: Build & Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 AppleClang
            slug: macos-arm64
            os: macos-15
            cc: clang
            cxx: clang++
            generator: ""
            arch: arm64
            python_arch: x64
            toolchain: apple
            msvc_arch: ""
            cmake_target: ""
            experimental: false
          - name: Linux x86_64 GCC 14
            slug: linux-x64-gcc-14
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            generator: -G Ninja
            arch: x64
            python_arch: x64
            toolchain: gcc
            msvc_arch: ""
            cmake_target: ""
            experimental: false
          - name: Linux arm64 GCC 14
            slug: linux-arm64-gcc-14
            os: ubuntu-24.04-arm
            cc: gcc-14
            cxx: g++-14
            generator: -G Ninja
            arch: arm64
            python_arch: arm64
            toolchain: gcc
            msvc_arch: ""
            cmake_target: ""
            experimental: false
          - name: Windows x64 clang-cl
            slug: windows-x64-clang-cl
            os: windows-2022
            cc: clang-cl
            cxx: clang-cl
            generator: -G Ninja
            arch: x64
            python_arch: x64
            toolchain: clang-cl
            msvc_arch: x64
            cmake_target: ""
            experimental: false
          - name: Windows arm64 clang-cl
            slug: windows-arm64-clang-cl
            os: windows-11-arm
            cc: clang-cl
            cxx: clang-cl
            generator: -G Ninja
            arch: arm64
            python_arch: arm64
            toolchain: clang-cl
            msvc_arch: arm64
            cmake_target: aarch64-pc-windows-msvc
            # windows-11-arm 仍是 public preview；稳定后改成 false
            experimental: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_arch }}

      - name: Install GCC 14
        if: matrix.toolchain == 'gcc'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build

      # ilammy/msvc-dev-cmd 仍声明 node20（上游 2024-04 后停更，node24 的
      # PR 未合并）；这里改用持续维护、已切到 node24 的分支，输入兼容。
      - name: Prepare MSVC environment
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress

      - name: Expose LLVM (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: printf '%s\n' 'C:\Program Files\LLVM\bin' >> "$GITHUB_PATH"

      - name: Ensure LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command clang-cl -ErrorAction SilentlyContinue) {
            clang-cl --version
            exit 0
          }
          choco install llvm -y --no-progress
          & "C:\Program Files\LLVM\bin\clang-cl.exe" --version

      - name: Check compiler
        shell: bash
        run: |
          set -euo pipefail
          "${{ matrix.cc }}" --version
          "${{ matrix.cxx }}" --version

      - name: Cache Conan
        uses: actions/cache@v5
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ runner.arch }}-${{ matrix.slug }}-${{ hashFiles('conanfile.py', 'conan_provider.cmake', 'conan.lock', 'cmake/conan.cmake') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ runner.arch }}-${{ matrix.slug }}-

      - name: Install Conan
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "conan>=2.33,<3"
          conan profile detect --force

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          if command -v cygpath >/dev/null 2>&1; then
            root="$(cygpath -m "$GITHUB_WORKSPACE")"
          else
            root="$GITHUB_WORKSPACE"
          fi
          # 让 conan 构建依赖时也使用 ARM64 目标（包括 x64 clang-cl 交叉编译的情况）
          if [ -n "${{ matrix.cmake_target }}" ]; then
            export CFLAGS="--target=${{ matrix.cmake_target }}"
            export CXXFLAGS="--target=${{ matrix.cmake_target }}"
          fi
          args=(
            -S "$root"
            -B build/ci
            -DCMAKE_BUILD_TYPE=Debug
            -DYUN_BUILD_TESTS=ON
            -DYUN_BUILD_PYTHON=OFF
            -DCMAKE_C_COMPILER="${{ matrix.cc }}"
            -DCMAKE_CXX_COMPILER="${{ matrix.cxx }}"
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="$root/cmake/conan.cmake"
            "-DCONAN_INSTALL_ARGS=--build=missing;--lockfile=$root/conan.lock"
          )
          if [ -n "${{ matrix.cmake_target }}" ]; then
            args+=(
              -DCMAKE_C_COMPILER_TARGET="${{ matrix.cmake_target }}"
              -DCMAKE_CXX_COMPILER_TARGET="${{ matrix.cmake_target }}"
            )
          fi
          if [ -n "${{ matrix.generator }}" ]; then
            args+=(-G Ninja)
          fi
          cmake "${args[@]}"

      - name: Build
        run: cmake --build build/ci --parallel

      - name: Unit tests
        run: ctest --test-dir build/ci --output-on-failure --timeout 300 --no-tests=error

      - name: Checkout functional cases
        uses: actions/checkout@v5
        with:
          repository: Hug7/yun-cases
          ref: v0.1.0
          path: .ci/yun-cases
          fetch-depth: 1

      - name: Functional test (C_SUC_001)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/run_functional_case.py \
            --build-dir build/ci \
            --case-zip .ci/yun-cases/feature_tests/C_SUC_001.zip \
            --work-dir "$RUNNER_TEMP/yun-case"

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ci-logs-${{ matrix.slug }}-${{ github.run_attempt }}
          path: |
            build/ci/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/yun-case/case/output/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  asan:
    name: ASan (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            slug: macos-arm64
            os: macos-15
            cc: clang
            cxx: clang++
            generator: ""
            arch: arm64
            python_arch: x64
            toolchain: apple
            experimental: false
          - name: Linux x86_64 GCC 14
            slug: linux-x64-gcc-14
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            generator: -G Ninja
            arch: x64
            python_arch: x64
            toolchain: gcc
            experimental: false
          - name: Linux arm64 GCC 14
            slug: linux-arm64-gcc-14
            os: ubuntu-24.04-arm
            cc: gcc-14
            cxx: g++-14
            generator: -G Ninja
            arch: arm64
            python_arch: arm64
            toolchain: gcc
            experimental: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_arch }}

      - name: Install GCC 14
        if: matrix.toolchain == 'gcc'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build

      - name: Cache Conan
        uses: actions/cache@v5
        with:
          path: ~/.conan2
          key: conan-asan-${{ runner.os }}-${{ runner.arch }}-${{ matrix.slug }}-${{ hashFiles('conanfile.py', 'conan_provider.cmake', 'conan.lock', 'cmake/conan.cmake') }}
          restore-keys: |
            conan-asan-${{ runner.os }}-${{ runner.arch }}-${{ matrix.slug }}-

      - name: Install Conan
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "conan>=2.33,<3"
          conan profile detect --force

      - name: Configure (ASan)
        shell: bash
        run: |
          set -euo pipefail
          if command -v cygpath >/dev/null 2>&1; then
            root="$(cygpath -m "$GITHUB_WORKSPACE")"
          else
            root="$GITHUB_WORKSPACE"
          fi
          args=(
            -S "$root"
            -B build/asan
            -DCMAKE_BUILD_TYPE=Debug
            -DYUN_BUILD_TESTS=ON
            -DYUN_BUILD_PYTHON=OFF
            -DENABLE_ASAN=ON
            -DCMAKE_C_COMPILER="${{ matrix.cc }}"
            -DCMAKE_CXX_COMPILER="${{ matrix.cxx }}"
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="$root/cmake/conan.cmake"
            "-DCONAN_INSTALL_ARGS=--build=missing;--lockfile=$root/conan.lock"
          )
          if [ -n "${{ matrix.generator }}" ]; then
            args+=(-G Ninja)
          fi
          cmake "${args[@]}"

      - name: Build (ASan)
        run: cmake --build build/asan --parallel

      - name: Test (ASan)
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
        run: ctest --test-dir build/asan --output-on-failure --timeout 300 --no-tests=error

      - name: Upload ASan logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: asan-logs-${{ matrix.slug }}-${{ github.run_attempt }}
          path: build/asan/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
